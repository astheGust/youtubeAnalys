<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analisador de playlists</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("playlist-theme") || "light"</script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="logic.js" defer></script>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <form id="searchForm" class="search-form" action="#" method="get">
        <input id="url" type="url" name="url" placeholder="Cole a URL da playlist do YouTube aqui..." required>
        <button type="submit">Analisar</button>
      </form>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Ativar modo noturno"
        title="Ativar modo noturno" aria-pressed="false"><i id="themeToggleIcon" class="fa-solid fa-moon"
          aria-hidden="true"></i></button>
    </header>
    <div id="loading" aria-label="Carregando"></div>
    <div id="excludedWarning"><button id="exclamIcon" type="button" aria-label="Mostrar aviso"
        aria-expanded="false">!</button><span id="excludedCount" aria-hidden="true"></span></div>
    <section id="analyzedUrl" class="playlist-summary" aria-live="polite">
      <div class="playlist-art" aria-hidden="true">
        <i class="fa-solid fa-music"></i>
      </div>
      <div class="playlist-name"><span>PLAYLIST</span><strong id="playlistTitle">Sua playlist analisada</strong><a
          href="#" target="_blank" rel="noreferrer">Abrir no YouTube Music</a></div>
      <div class="summary-stat"><span>Músicas</span><strong id="songCount">0</strong></div>
      <div class="summary-stat wide"><span>Mais vista</span><strong id="viewsCount">0</strong></div>
    </section>
    <article id="results" class="results">
      <section class="tracks-panel">
        <div class="panel-heading sort-bar">
          <h2>Faixas <span class="sort-bar__countLabel"></span></h2>
          <div class="sort-menu-wrapper"><button id="sortToggle" class="sort-toggle" type="button" aria-haspopup="true"
              aria-expanded="false"><span>Ordenar: <b id="sortToggleText">Padrão</b></span></button>
            <div id="sortMenu" class="sort-menu" role="menu"><button class="sort-menu__item is-active" type="button"
                role="menuitem" data-sort="default"><span>Padrão</span></button><button class="sort-menu__item"
                type="button" role="menuitem" data-sort="artist"><span>Artista A-Z</span></button><button
                class="sort-menu__item" type="button" role="menuitem" data-sort="music"><span>Música A-Z</span></button>
            </div>
          </div>
        </div>
        <div class="cards-list"></div>
      </section>
      <section class="charts-panel">
        <div class="graphic-data-content" aria-label="Análise da playlist" aria-live="polite">
          <div class="carousel-viewport">
            <div id="carouselTrack" class="carousel-track">
              <section class="carousel-slide" role="group" aria-label="Músicas por artista">
                <header class="carousel-slide-header">
                  <h2>Músicas por artista</h2>
                  <div class="chart-mode-switch" role="group" aria-label="Tipo de gráfico">
                    <button class="chart-mode-button is-active" type="button" data-chart-mode="less" aria-pressed="true">Rosca</button>
                    <button class="chart-mode-button" type="button" data-chart-mode="more" aria-pressed="false">Barras + linha</button>
                  </div>
                </header>
                <div class="chart-content">
                  <div class="chart-box"><canvas id="artistChart"></canvas></div>
                  <div id="artistLegend" class="graphicSub"></div>
                </div>
              </section>
              <section class="carousel-slide" role="group" aria-label="Duração" aria-hidden="true">
                <header class="carousel-slide-header">
                  <h2>Duração</h2>
                </header>
                <div id="durationExtremes" class="extreme-grid"></div>
              </section>
              <section class="carousel-slide" role="group" aria-label="Visualizações" aria-hidden="true">
                <header class="carousel-slide-header">
                  <h2>Visualizações</h2>
                </header>
                <div id="viewsExtremes" class="extreme-grid"></div>
              </section>
            </div>
          </div>
          <nav class="carousel-indicators" aria-label="Navegação pelas seções"><button
              class="carousel-indicator is-active" type="button" data-slide-index="0"><span></span></button><button
              class="carousel-indicator" type="button" data-slide-index="1"><span></span></button><button
              class="carousel-indicator" type="button" data-slide-index="2"><span></span></button></nav>
          <section class="genre-summary" aria-label="Estilo musical da playlist" aria-live="polite">
            <h3>Estilo da playlist</h3>
            <div id="genreSummaryLoader" class="genre-summary-loader" role="status" hidden>
              <div class="genre-loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
              <p>carregando análise...</p>
            </div>
            <p id="genreSummary" hidden></p>
            <p id="genreSummaryNote" class="genre-summary-note" hidden>Essa análise está sujeita a mudanças devido ao método.</p>
          </section>
        </div>
      </section>
    </article>
  </main>
</body>

</html>
