<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Análise</title>
    <link rel="stylesheet" href="style.css" />
    <script src="logic.js" defer></script>
</head>

<body>
    <main>
        <section class="search-section">
            <form id="searchForm" class="search-form" action="#" method="get">
                <input type="url" name="url" placeholder="Cole a URL do YouTube aqui..." required />
                <button type="submit">Analisar</button>
            </form>
        </section>
        <article class="results">
            <section id="resultSection" class="cards-section">
                <!-- cards criados dinamicamente via logic.js -->
            </section>
            <section class="option-section">
                <div class="option-btn">opcao1</div>
            </section>
        </article>
    </main>
</body>

</html>
